[Proxy Group]
# Manual policy groups
Proxy = select,DIRECT,img-url = https://raw.githubusercontent.com/mphin/GroupIcons/main/icon/emoji/apple/emojiall_dart.png
BackCN = select,DIRECT,img-url = https://raw.githubusercontent.com/mphin/GroupIcons/main/icon/emoji/apple/emojiall_cn.png

[Rule]
# When the config has no valid policy group, Loon falls back to the built-in PROXY group
# When valid policy groups exist, the built-in PROXY group is disabled - only user-defined groups can be used
# Built-in remote GEOIP, cn, DIRECT rules are already included; do not add duplicates here
# Do not reorder or remove the remote CN REGION rule below
FINAL,DIRECT

